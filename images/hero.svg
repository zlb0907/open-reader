<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="开放书库 OpenReader 项目横幅">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="17.5" fill="none" stroke="#dbe3f0"/>

  <!-- logo -->
  <rect x="56" y="62" width="76" height="76" rx="20" fill="url(#brand)"/>
  <rect x="76" y="92" width="9" height="26" rx="3" fill="#ffffff"/>
  <rect x="90" y="80" width="9" height="38" rx="3" fill="#ffffff"/>
  <rect x="104" y="88" width="9" height="30" rx="3" fill="#ffffff"/>

  <text x="150" y="98" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="700" fill="#111827">开放书库</text>
  <text x="150" y="132" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" letter-spacing="2" fill="#4f46e5">OpenReader</text>
  <text x="56" y="188" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="20" fill="#334155">免费 · 离线 · 开放格式的本地电子书阅读器</text>
  <text x="56" y="218" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="16" fill="#64748b">书库就是一个能直接拷走的文件夹，没有账号、没有加密容器。</text>

  <!-- tags -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#4338ca">
    <rect x="56" y="240" width="118" height="30" rx="15" fill="#e0e7ff"/><text x="75" y="260">Windows 单 exe</text>
    <rect x="184" y="240" width="106" height="30" rx="15" fill="#e0e7ff"/><text x="203" y="260">Android apk</text>
    <rect x="300" y="240" width="94" height="30" rx="15" fill="#e0e7ff"/><text x="319" y="260">20+ 格式</text>
    <rect x="404" y="240" width="94" height="30" rx="15" fill="#e0e7ff"/><text x="423" y="260">无广告</text>
  </g>

  <!-- desktop window sketch -->
  <g transform="translate(660,52)">
    <rect x="0" y="0" width="310" height="196" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="310" height="28" rx="12" fill="#f1f5f9"/>
    <rect x="12" y="10" width="8" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="26" y="10" width="8" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="16" y="42" width="60" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="16" y="60" width="278" height="124" rx="6" fill="#f8fafc"/>
    <g>
      <rect x="28" y="72" width="52" height="72" rx="5" fill="#b7791f"/>
      <rect x="90" y="72" width="52" height="72" rx="5" fill="#2c7a7b"/>
      <rect x="152" y="72" width="52" height="72" rx="5" fill="#4c51bf"/>
      <rect x="214" y="72" width="52" height="72" rx="5" fill="#9b2c5d"/>
      <rect x="28" y="152" width="40" height="5" rx="2.5" fill="#cbd5e1"/>
      <rect x="90" y="152" width="40" height="5" rx="2.5" fill="#cbd5e1"/>
      <rect x="152" y="152" width="40" height="5" rx="2.5" fill="#cbd5e1"/>
      <rect x="214" y="152" width="40" height="5" rx="2.5" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- phone sketch -->
  <g transform="translate(1000,34)">
    <rect x="0" y="0" width="132" height="230" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="10" y="20" width="112" height="190" rx="8" fill="#f8fafc"/>
    <rect x="20" y="32" width="60" height="6" rx="3" fill="#94a3b8"/>
    <rect x="20" y="48" width="92" height="22" rx="5" fill="#4f46e5"/>
    <rect x="20" y="80" width="42" height="58" rx="4" fill="#b7791f"/>
    <rect x="70" y="80" width="42" height="58" rx="4" fill="#2c7a7b"/>
    <rect x="20" y="146" width="92" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="20" y="160" width="72" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="20" y="174" width="82" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="46" y="218" width="40" height="4" rx="2" fill="#cbd5e1"/>
  </g>
</svg>
